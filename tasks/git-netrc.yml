---
- block:
    - name: create file ~/.netrc to access private git
      shell: |
        echo "machine {{ git_host }} login {{ git_user }} password {{ git_token }}" > ~/.netrc
        chmod og-rw ~/.netrc
      no_log: true

    - name: clone / update repository to {{ git_destination }}
      git:
        repo: "{{ git_repository }}"
        dest: "{{ git_destination }}"
        version: "{{ git_version }}"
        force: "{{ git_force }}"
        depth: "{{ git_depth }}"
      ignore_errors: true

    # bash to fetch git commit version
    - name: fetch git commit version
      shell: |
        cd {{ git_destination }}
        git fetch --force origin {{ git_version }} --depth 1
        git checkout {{ git_version }}
    
    # delete all local branch expect {{ git_version }}
    - name: delete all local branch expect {{ git_version }}
      shell: |
        cd {{ git_destination }}
        git branch | grep -v {{ git_version }} | xargs git branch -D
      ignore_errors: true

    - name: remove file ~/.netrc
      ansible.builtin.file:
        state: absent
        path: "~/.netrc"
      when: git_token != ''
      no_log: true

  become: true
  become_user: "{{ git_linux_user }}"